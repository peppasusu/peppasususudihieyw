<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>泉州花灯·自由组合</title>
  <style>
    @font-face {
      font-family: "DreamHanSerifCN";
      src: url("./fonts/DreamHanSerifCN-W22.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --theme: #2c1552;
      --theme-active: #5a2b96;
      --type-theme: #bc9ee1;
      --type-theme-active: #a87dcf;
      --text-on-theme: #ffffff;
      --disabled-bg: #ddd2ee;
      --disabled-text: #8a8099;
      --page-bg: #100921;
      --page-edge-gap: 18px;
      --type-title-top: 30px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      height: 100%;
      background: #100921;
    }

    body {
      margin: 0;
      min-height: 100vh;
      height: 100%;
      background: #100921;
      font-family: "DreamHanSerifCN", sans-serif;
      color: #2f2a36;
      overflow: hidden;
    }

    button {
      font-family: inherit;
    }

    .app {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background: var(--page-bg);
      overflow: hidden;
      display: block;
    }

    .hidden {
      display: none !important;
    }

    .page {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    #homePage {
      background: var(--page-bg) url("images/home_bg.png") center / cover no-repeat;
    }

    #typePage {
      background: var(--page-bg);
    }

    .type-content {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 72px 24px 24px;
    }

    .type-title {
      position: absolute;
      top: var(--type-title-top);
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      margin: 0;
      font-size: 30px;
      line-height: 1.2;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      pointer-events: none;
    }

    .type-back-btn {
      position: absolute;
      top: calc(var(--type-title-top) - 2px);
      left: var(--page-edge-gap);
      z-index: 2;
    }

    .type-btn {
      position: relative;
      width: clamp(170px, 20vw, 280px);
      aspect-ratio: 3 / 4;
      border: 0;
      border-radius: 12px;
      background: var(--theme);
      color: #fff;
      font-size: 28px;
      line-height: 1.2;
      font-weight: 600;
      cursor: pointer;
      padding: 18px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      overflow: visible;
    }

    .type-btn.with-desc {
      justify-content: flex-start;
      gap: 10px;
      padding: 14px 14px 16px;
    }

    .type-btn-title {
      display: block;
      font-size: 28px;
      line-height: 1.15;
      font-weight: 700;
      margin-top: 2px;
    }

    .type-btn.with-desc .type-btn-title {
      margin-top: 0;
    }

    .type-btn-desc {
      display: block;
      width: 100%;
      font-size: 13px;
      line-height: 1.45;
      font-weight: 500;
      text-align: center;
      white-space: normal;
      overflow: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .type-btn-desc::-webkit-scrollbar {
      display: none;
    }

    .type-btn.active,
    .type-btn:active {
      background: var(--theme-active);
      border-color: #7c5da7;
    }

    /* 选择页图片按钮：点击不出现紫色选中底 */
    .type-btn-image,
    .type-btn-image:active,
    .type-btn-image:focus-visible,
    .type-btn-image.active {
      background: transparent !important;
      border-color: transparent !important;
      outline: none;
    }

    .type-cards {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: clamp(16px, 2.2vw, 34px);
      overflow: visible;
    }

    .type-btn-image {
      width: clamp(220px, 24vw, 340px);
      height: auto;
      aspect-ratio: auto;
      border: 0;
      border-radius: 0;
      padding: 0;
      background: transparent;
      display: block;
      position: relative;
      overflow: visible;
      transform: translateY(-40px);
    }

    .type-btn-image img {
      width: 100%;
      height: auto;
      object-fit: contain;
      border-radius: 20px;
      display: block;
      pointer-events: none;
      user-select: none;
    }

    .type-btn-image.active img,
    .type-btn-image:active img {
      border-radius: 20px;
    }

    .type-btn-main-img-plain {
      position: relative;
      z-index: 2;
    }

    .type-btn-kezhi {
      border: 0;
      background: transparent;
      padding: 0;
      display: block;
    }

    .type-btn-kezhi-main {
      position: relative;
      z-index: 2;
      width: 100%;
      height: auto;
      border-radius: 6px;
      overflow: hidden;
      display: block;
    }

    .type-btn-kezhi-main img {
      width: 100%;
      height: auto;
      object-fit: contain;
      display: block;
      pointer-events: none;
      user-select: none;
    }

    .type-btn-open-panel {
      position: absolute;
      left: 50%;
      top: calc(100% + 30px);
      z-index: 1;
      width: 100%;
      height: auto;
      opacity: 0;
      transform: translate(-50%, -62%) scale(0.985);
      transform-origin: top center;
      transition: opacity 220ms ease, transform 280ms cubic-bezier(0.2, 0.75, 0.2, 1);
      pointer-events: none;
    }

    .type-btn-open-panel.bottom-layer {
      z-index: 0;
    }

    .type-btn-open-panel.zhizha-open {
      top: calc(100% + 40px);
    }

    .type-btn-open-panel.zhenci-open {
      top: calc(100% + 40px);
    }

    .type-btn-open-panel img {
      width: 100%;
      height: auto;
      object-fit: contain;
      border-radius: 0;
      display: block;
      pointer-events: none;
      user-select: none;
    }

    .type-btn-image:hover .type-btn-open-panel,
    .type-btn-image:focus-visible .type-btn-open-panel {
      opacity: 1;
      transform: translate(-50%, -20%) scale(1);
    }

    .home-bg-float-stack {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .home-bg-float-stack img {
      position: absolute;
      inset: -3.5%;
      width: 107%;
      height: 107%;
      object-fit: cover;
      object-position: center;
    }

    .home-bg-float-stack img:nth-child(1) {
      z-index: 1;
      animation: home-bg-float-1 6.93s ease-in-out infinite;
      animation-delay: 0s;
    }

    .home-bg-float-stack img:nth-child(2) {
      z-index: 2;
      animation: home-bg-float-2 7.47s ease-in-out infinite;
      animation-delay: -1.17s;
    }

    .home-bg-float-stack img:nth-child(3) {
      z-index: 3;
      animation: home-bg-float-3 8.21s ease-in-out infinite;
      animation-delay: -2.58s;
    }

    .home-bg-float-stack img:nth-child(4) {
      z-index: 4;
      animation: home-bg-float-4 7.08s ease-in-out infinite;
      animation-delay: -0.41s;
    }

    .home-bg-float-stack img:nth-child(5) {
      z-index: 5;
      animation: home-bg-float-5 9.07s ease-in-out infinite;
      animation-delay: -3.94s;
    }

    .home-bg-float-stack img:nth-child(6) {
      z-index: 6;
      animation: home-bg-float-6 6.64s ease-in-out infinite;
      animation-delay: -1.83s;
    }

    .home-bg-float-stack img:nth-child(7) {
      z-index: 7;
      animation: home-bg-float-7 8.76s ease-in-out infinite;
      animation-delay: -4.71s;
    }

    @keyframes home-bg-float-1 {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-3.55%);
      }
    }

    @keyframes home-bg-float-2 {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(3.05%);
      }
    }

    @keyframes home-bg-float-3 {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-2.6%);
      }
    }

    @keyframes home-bg-float-4 {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(3.4%);
      }
    }

    @keyframes home-bg-float-5 {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-4.45%);
      }
    }

    @keyframes home-bg-float-6 {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(2.75%);
      }
    }

    @keyframes home-bg-float-7 {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-3.25%);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .home-bg-float-stack img {
        animation: none !important;
      }
    }

    .home-content {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
    }

    .start-btn {
      position: absolute;
      left: 50%;
      top: 74%;
      transform: translate(-50%, -50%);
      width: 188px;
      height: 58px;
      border: 0;
      border-radius: 30px;
      background: #ffffff;
      color: #000000;
      font-size: 26px;
      font-weight: 600;
      cursor: pointer;
    }

    #makerPage {
      padding: 0;
      box-sizing: border-box;
      height: 100%;
      min-height: 100%;
    }

    .maker-shell {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: var(--page-edge-gap) var(--page-edge-gap) 8px;
      box-sizing: border-box;
    }

    .maker-main {
      display: flex;
      flex-direction: row;
      flex: 1;
      min-height: 0;
      gap: 14px;
      align-items: stretch;
    }

    .maker-stage {
      flex: 6 1 0;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      padding: clamp(6px, 1.2vw, 20px);
    }

    .maker-panel {
      flex: 4 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0;
      min-height: 0;
      overflow: hidden;
    }

    .maker-topbar {
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 1;
      flex-shrink: 0;
    }

    .back-btn,
    .confirm-btn {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 8px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      line-height: 40px;
    }

    .back-btn img {
      width: 59.2%;
      height: 59.2%;
      object-fit: contain;
      display: block;
      transform: translate(1px, -1px);
      pointer-events: none;
      user-select: none;
    }

    .confirm-btn img {
      width: 130%;
      height: 130%;
      object-fit: contain;
      display: block;
      pointer-events: none;
      user-select: none;
    }

    .back-btn {
      background: transparent;
      color: inherit;
    }

    .confirm-btn {
      background: transparent;
      color: inherit;
      justify-content: flex-end;
    }

    .display-area {
      position: relative;
      flex: 1 1 0;
      min-height: 0;
      align-self: center;
      width: 86%;
      max-width: 100%;
      border-radius: 8px;
      overflow: hidden;
      background: #100921;
      border: 1px solid rgba(0, 0, 0, 0.1);
      z-index: 1;
    }

    .maker-nav-btn {
      position: absolute;
      top: 48%;
      transform: translateY(-50%);
      width: 42px;
      height: 42px;
      border: 0;
      padding: 0;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 2;
    }

    .maker-nav-btn img {
      width: 110%;
      height: 110%;
      object-fit: contain;
      display: block;
      pointer-events: none;
      user-select: none;
    }

    .maker-nav-left {
      left: 52px;
    }

    .maker-nav-right {
      right: 52px;
    }

    .maker-show-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      transform: scale(1.12) translateY(-1.2%);
      transform-origin: center center;
      z-index: 0;
      pointer-events: none;
      user-select: none;
    }

    .flip-scene {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      min-height: 0;
      perspective: 1000px;
    }

    .flip-card {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 0;
      transform-style: preserve-3d;
    }

    .flip-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .flip-back {
      transform: rotateY(180deg);
      display: flex;
      align-items: center;
      justify-content: center;
      background: #100921;
    }

    /* 与画布上 combo 成品图一致：在 97% 框内 contain 居中（见 COMBO_PREVIEW_FIT） */
    .combo-preview-fit {
      width: 97%;
      height: 97%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      pointer-events: none;
    }

    .combo-preview-fit img {
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
      user-select: none;
    }

    #lampCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #lampCanvas.lamp-enter-glow {
      animation: lampEnterGlow 1180ms cubic-bezier(0.2, 0.72, 0.2, 1);
      will-change: filter, opacity;
    }

    @keyframes lampEnterGlow {
      0% {
        opacity: 0;
        filter: brightness(0.62) drop-shadow(0 0 0 rgba(255, 186, 246, 0));
      }
      58% {
        opacity: 1;
        filter: brightness(1.06) drop-shadow(0 0 10px rgba(255, 139, 234, 0.3));
      }
      100% {
        opacity: 1;
        filter: brightness(0.98) drop-shadow(0 0 5px rgba(214, 130, 255, 0.18));
      }
    }

    .tabs {
      display: flex;
      gap: 0;
      z-index: 1;
      flex-shrink: 0;
      height: 68px;
      padding: 0 10px;
      border-radius: 12px 12px 0 0;
      background: #2a1d44;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-bottom: 0;
      align-items: stretch;
    }

    .tab-btn {
      flex: 1;
      border: 0;
      border-radius: 0;
      height: 68px;
      padding: 0 6px;
      font-size: 20px;
      background: transparent;
      color: rgba(255, 255, 255, 0.62);
      cursor: pointer;
      position: relative;
      font-weight: 600;
    }

    .tab-btn.active {
      color: #ffffff;
    }

    .tab-btn.active::after {
      content: "";
      position: absolute;
      left: 34%;
      right: 34%;
      bottom: 0;
      height: 3px;
      border-radius: 999px;
      background: #ffffff;
    }

    .tab-btn.locked {
      background: #271a41;
      color: rgba(255, 255, 255, 0.45);
      cursor: not-allowed;
    }

    .tab-btn.locked::after {
      display: none;
    }

    .bottom-area {
      display: flex;
      flex-direction: row;
      gap: 0;
      width: 100%;
      min-height: 0;
      flex: 1;
      z-index: 1;
      overflow: hidden;
    }

    .left-buttons {
      width: 108px;
      display: flex;
      flex-direction: column;
      gap: 0;
      flex-shrink: 0;
      border-radius: 0;
      overflow: hidden;
      background: #271a41;
    }

    .mode-btn {
      width: 100%;
      height: 76px;
      border: 0;
      border-radius: 0;
      background: #2a1d44;
      color: rgba(255, 255, 255, 0.72);
      font-size: 17px;
      cursor: pointer;
      text-align: center;
      padding: 0;
    }

    .mode-btn.active {
      background: #392952;
      color: #ffffff;
    }

    #patternBtn:not(.active):not(:disabled) {
      background: #271a41;
    }

    .mode-btn:disabled {
      background: #1b1330;
      color: var(--disabled-text);
      cursor: not-allowed;
    }

    /* 非灯体 Tab：不显示纹样，仅隐藏该按钮 */
    #patternBtn.pattern-tab-hidden {
      display: none;
    }

    .right-options {
      flex: 1;
      width: 100%;
      padding: 10px;
      border-radius: 0;
      background: #392952;
      border: 0;
      overflow-y: auto;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      align-content: start;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .right-options::-webkit-scrollbar {
      display: none;
    }

    .right-options.grid-2x3 {
      grid-template-columns: repeat(3, 1fr);
    }

    .option {
      width: 100%;
      aspect-ratio: 3 / 3.5;
      border-radius: 8px;
      border: 2px solid rgba(99, 76, 116, 0.6);
      background: #352050;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 6px;
      cursor: pointer;
      text-align: center;
      user-select: none;
      min-height: 0;
    }

    .option.active {
      border: 2px solid transparent;
      background:
        linear-gradient(#352050, #352050) padding-box,
        linear-gradient(45deg, #cd76fc, #ff4aa7, #6b73ff) border-box;
    }

    .option.disabled {
      opacity: 0.45;
      cursor: not-allowed;
      border-color: transparent;
      background: #5b4b73;
    }

    .option.placeholder {
      visibility: hidden;
      pointer-events: none;
    }

    .option img {
      max-width: 82%;
      max-height: 78%;
      width: auto;
      height: auto;
      object-fit: contain;
      pointer-events: none;
      flex-shrink: 0;
    }

    /* 灯体 → 纹样：缩略图与下方文案 */
    .option.pattern-option img {
      max-height: 54%;
    }

    .option.pattern-option {
      gap: 14px;
      justify-content: center;
      align-items: center;
      padding: 6px 5px 10px;
    }

    .option.pattern-option span {
      font-size: 18px;
      line-height: 1.42;
      text-align: center;
      width: 100%;
      flex-shrink: 0;
      margin-top: 4px;
    }

    /* 灯体 → 样式：第 2 个选项缩略图缩小到 90% */
    .option.thumb-90 img {
      display: block;
      transform: scale(0.9);
      transform-origin: center center;
    }

    .option.thumb-80 img {
      display: block;
      transform: scale(0.8);
      transform-origin: center center;
    }

    /* 灯体 → 样式：第 1 个选项缩略图缩小到 80% */
    .option.thumb-70 img {
      display: block;
      transform: scale(0.7);
      transform-origin: center center;
    }

    .option span {
      font-size: 13px;
      line-height: 1.25;
      pointer-events: none;
      text-align: center;
    }

    #makerPage.preview-mode .maker-show-bg {
      display: none;
    }

    #makerPage.preview-mode .maker-nav-btn {
      display: none;
    }

    #makerPage.preview-mode .maker-panel {
      display: none;
    }

    #makerPage.preview-mode .confirm-btn {
      display: none;
    }

    .preview-replay-btn {
      display: none;
      position: absolute;
      z-index: 2;
      right: max(14px, env(safe-area-inset-right, 0px));
      bottom: max(14px, env(safe-area-inset-bottom, 0px));
      padding: 10px 18px;
      border: 0;
      border-radius: 8px;
      background: var(--theme);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }

    #makerPage.preview-mode .preview-replay-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .preview-replay-btn .preview-replay-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      transform: translateY(0.4px);
    }

    /* 预览：仅左侧展示区，卡片在区域内水平垂直居中并放大 */
    #makerPage.preview-mode .maker-main {
      gap: 0;
    }

    #makerPage.preview-mode .maker-stage {
      flex: 1;
      padding: clamp(10px, 2vw, 40px);
    }

    #makerPage.preview-mode .display-area {
      flex: 1 1 0;
      min-height: 0;
      align-self: center;
      width: 86%;
      max-width: min(100%, calc(100vw - 24px));
      margin: 0 auto;
    }

    /* 打勾进入预览时：先看到背面，再翻到正面，缓动靠后 */
    .flip-card.flip-on-enter {
      animation: previewCardFlip 1700ms cubic-bezier(0.22, 0.7, 0.2, 1);
      animation-fill-mode: both;
      will-change: transform;
    }

    @keyframes previewCardFlip {
      0% { transform: rotateY(180deg); }
      29.4% { transform: rotateY(180deg); } /* 前 0.5s 停在背面 */
      100% { transform: rotateY(360deg); }
    }

    @media (max-width: 720px) {
      .maker-main {
        flex-direction: column;
      }

      .maker-panel {
        flex: 0 1 auto;
        width: 100%;
        max-width: 100%;
        max-height: 46vh;
      }

      .maker-stage {
        flex: 1 1 auto;
        min-height: 0;
      }

      .display-area {
        flex: 1 1 0;
        align-self: stretch;
        width: 100%;
        min-height: 260px;
        max-height: min(62vh, 640px);
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <section id="homePage" class="page">
      <div class="home-bg-float-stack" aria-hidden="true">
        <img src="images/home_bg_1.png" alt="" />
        <img src="images/home_bg_2.png" alt="" />
        <img src="images/home_bg_3.png" alt="" />
        <img src="images/home_bg_4.png" alt="" />
        <img src="images/home_bg_5.png" alt="" />
        <img src="images/home_bg_6.png" alt="" />
        <img src="images/home_bg_7.png" alt="" />
      </div>
      <div class="home-content">
        <button id="startBtn" class="start-btn">开始制作</button>
      </div>
    </section>

    <section id="typePage" class="page hidden">
      <img class="bg" src="images/maker_bg.png" alt="类型页背景" />
      <button id="typeBackBtn" class="back-btn type-back-btn" aria-label="返回首页">
        <img src="images/icon_back.png" alt="" aria-hidden="true" />
      </button>
      <h2 class="type-title">选择花灯工艺</h2>
      <div class="type-content">
        <div class="type-cards">
          <button class="type-btn type-btn-image type-btn-kezhi" data-type="kezhi_liaosi" aria-label="刻纸料丝灯">
            <span class="type-btn-kezhi-main">
              <img src="images/type_kezhi.png" alt="" aria-hidden="true" />
            </span>
            <span class="type-btn-open-panel" aria-hidden="true">
              <img src="images/type_kezhi_open.png" alt="" />
            </span>
          </button>
          <button class="type-btn type-btn-image" data-type="zhizha" aria-label="纸扎灯">
            <img class="type-btn-main-img-plain" src="images/type_zhizha.png" alt="" aria-hidden="true" />
            <span class="type-btn-open-panel bottom-layer zhizha-open" aria-hidden="true">
              <img src="images/type_zhizha_open.png" alt="" />
            </span>
          </button>
          <button class="type-btn type-btn-image" data-type="zhenci_wugu" aria-label="针刺无骨灯">
            <img class="type-btn-main-img-plain" src="images/type_zhenci_wugu.png" alt="" aria-hidden="true" onerror="this.onerror=null;this.src='images/type_zhenci.png';" />
            <span class="type-btn-open-panel bottom-layer zhenci-open" aria-hidden="true">
              <img src="images/type_zhenci_open.png" alt="" />

          </button>

      </div>
    </section>

    <section id="makerPage" class="page hidden">
      <img class="bg" src="images/maker_bg.png" alt="制作页背景" />

      <div class="maker-shell">
        <div class="maker-topbar">
          <button id="backBtn" class="back-btn" aria-label="返回">
            <img src="images/icon_back.png" alt="" aria-hidden="true" />
          </button>
          <button id="confirmBtn" class="confirm-btn" aria-label="预览成品">
            <img src="images/icon_done.png" alt="" aria-hidden="true" />
          </button>
        </div>

        <div class="maker-main">
          <div class="maker-stage">
            <div class="display-area">
              <button id="makerNavLeft" class="maker-nav-btn maker-nav-left" aria-label="上一个样式">
                <img src="images/icon_maker_left.png" alt="" aria-hidden="true" />
              </button>
              <button id="makerNavRight" class="maker-nav-btn maker-nav-right" aria-label="下一个样式">
                <img src="images/icon_maker_right.png" alt="" aria-hidden="true" />
              </button>
              <img class="maker-show-bg" src="images/maker_show.png" alt="" aria-hidden="true" />
              <div class="flip-scene">
                <div id="flipCard" class="flip-card">
                  <div class="flip-face flip-front">
                    <canvas id="lampCanvas"></canvas>
                  </div>
                  <div class="flip-face flip-back">
                    <div class="combo-preview-fit">
                      <img id="comboBackImg" src="images/combo_back.png" alt="组合背面" />
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="maker-panel">
            <div class="tabs" id="tabsWrap"></div>

            <div class="bottom-area">
              <div class="left-buttons">
                <button id="styleBtn" class="mode-btn active" data-mode="style">样式</button>
                <button id="patternBtn" class="mode-btn" data-mode="pattern" disabled>纹样</button>

          </div>
        </div>
      </div>
      <button type="button" id="previewReplayBtn" class="preview-replay-btn" aria-label="重新播放预览动效">
        <svg class="preview-replay-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
          <path
            fill="currentColor"
            d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"
          />
        </svg>
        重新播放
      </button>
    </section>
  </div>

  <script>
    const OPTION_COUNTS = { cap: 4, bodyStyle: 4, bodyPattern: 4, base: 4, chui: 6 };
    const OPTION_SLOT_COUNT_CHUI = 6;
    const OPTION_SLOT_COUNT_DEFAULT = 4;
    const BODY_PATTERN_LABELS = ["繁花似锦", "年年有余", "泉州东西塔", "凤舞吉祥"];
    /** 灯图在展示区内相对垂直居中再略向上（相对画布高度） */
    const LAMP_DRAW_SHIFT_UP_RATIO = 0.038;
    /** 预览中 combo / combo_back 在展示区内留白比例，须与 .combo-preview-fit 的 97% 一致 */
    const COMBO_PREVIEW_FIT = 0.97;

    const LAMP_TYPES = [
      { key: "kezhi_liaosi", label: "刻纸料丝灯" },
      { key: "zhizha", label: "纸扎灯" },
      { key: "zhenci_wugu", label: "针刺无骨灯" },
    ];

    const tabs = [
      { key: "cap", label: "灯帽" },
      { key: "body", label: "灯体" },
      { key: "base", label: "灯托" },
      { key: "chui", label: "灯垂" }
    ];

    function createDefaultState() {
      return {
        currentTab: "cap",
        bodyMode: "style",
        zhenciMode: "pattern",
        zhenciDisplayMode: null,
        selected: { cap: 1, bodyStyle: 1, bodyPattern: 1, base: 1, chui: 1, zhenciPattern: 1, zhenciColor: 1 },
        bodyDisplayMode: "style",
        shownParts: { cap: false, body: false, base: false, chui: false, zhenciPattern: false, zhenciColor: false },
        previewMode: false
      };
    }

    let currentLampType = null;
    const makerStates = Object.fromEntries(LAMP_TYPES.map((item) => [item.key, createDefaultState()]));
    let state = makerStates.kezhi_liaosi;

    const imageCache = new Map();

    const homePage = document.getElementById("homePage");
    const typePage = document.getElementById("typePage");
    const makerPage = document.getElementById("makerPage");
    const startBtn = document.getElementById("startBtn");
    const backBtn = document.getElementById("backBtn");
    const typeBackBtn = document.getElementById("typeBackBtn");
    const confirmBtn = document.getElementById("confirmBtn");
    const previewReplayBtn = document.getElementById("previewReplayBtn");
    const tabsWrap = document.getElementById("tabsWrap");
    const styleBtn = document.getElementById("styleBtn");
    const patternBtn = document.getElementById("patternBtn");
    const optionsGrid = document.getElementById("optionsGrid");
    const makerNavLeft = document.getElementById("makerNavLeft");
    const makerNavRight = document.getElementById("makerNavRight");
    const flipCard = document.getElementById("flipCard");
    const comboBackImg = document.getElementById("comboBackImg");
    const canvas = document.getElementById("lampCanvas");
    const ctx = canvas.getContext("2d");
    const typeButtons = Array.from(document.querySelectorAll(".type-btn"));
    let lampFxTimer = null;

    function getTypeDir() {
      return currentLampType || "kezhi_liaosi";
    }

    function isZhenciType() {
      return getTypeDir() === "zhenci_wugu";
    }

    function isBodyStyle2() {
      if (getTypeDir() === "zhizha") return state.selected.bodyStyle === 4;
      return state.selected.bodyStyle === 2;
    }

    function setCanvasSize() {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = Math.floor(rect.width * dpr);
      canvas.height = Math.floor(rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    /**
     * 组合成品图：combo_灯帽_灯体_灯托_灯垂.png
     * 灯体：当前为纹样显示时用 pattern_纹样编号，否则为样式编号 1~4
     * 灯垂：1~6（与选项一致，6 表示无灯垂时对应素材名中的 6）
     * 例：combo_1_2_3_1.png、combo_3_pattern_1_2_4.png
     */
    function getComboImageSrc() {
      const s = state.selected;
      if (isZhenciType()) {
        return `images/${getTypeDir()}/combo_${s.zhenciPattern}_${s.zhenciColor}.png`;
      }
      const bodySeg =
        state.bodyDisplayMode === "pattern" ? `pattern_${s.bodyPattern}` : String(s.bodyStyle);
      const comboDir = getTypeDir() === "zhizha"
        ? `images/${getTypeDir()}/combos`
        : `images/${getTypeDir()}`;
      return `${comboDir}/combo_${s.cap}_${bodySeg}_${s.base}_${s.chui}.png`;
    }

    function getOptionMeta() {
      const { currentTab, bodyMode, selected } = state;
      if (isZhenciType()) {
        if (state.zhenciMode === "color") {
          return { prefix: "color_", title: "颜色", active: selected.zhenciColor, count: 4, disabled: false };
        }
        return { prefix: "pattern_", title: "纹样", active: selected.zhenciPattern, count: 4, disabled: false };
      }
      if (currentTab === "cap") return { prefix: "cap_", title: "灯帽", active: selected.cap, count: OPTION_COUNTS.cap, disabled: false };
      if (currentTab === "base") return { prefix: "base_", title: "灯托", active: selected.base, count: OPTION_COUNTS.base, disabled: false };
      if (currentTab === "chui") return { prefix: "chui_", title: "灯垂", active: selected.chui, count: OPTION_COUNTS.chui, disabled: false };
      if (bodyMode === "style") {
        return { prefix: "body_style_", title: "样式", active: selected.bodyStyle, count: OPTION_COUNTS.bodyStyle, disabled: false };
      }
      const patternCount = getTypeDir() === "zhizha" ? 2 : OPTION_COUNTS.bodyPattern;
      return {
        prefix: "body_pattern_",
        title: "纹样",
        optionLabels: BODY_PATTERN_LABELS,
        active: selected.bodyPattern,
        count: patternCount,
        disabled: !isBodyStyle2()
      };
    }

    function renderTabs() {
      tabsWrap.innerHTML = "";
      if (isZhenciType()) {
        tabs.forEach((item) => {
          const btn = document.createElement("button");
          btn.className = "tab-btn locked";
          btn.textContent = item.label;
          btn.disabled = true;
          tabsWrap.appendChild(btn);
        });
        return;
      }
      tabs.forEach((item) => {
        const btn = document.createElement("button");
        btn.className = "tab-btn" + (state.currentTab === item.key ? " active" : "");
        btn.textContent = item.label;
        btn.dataset.key = item.key;
        btn.addEventListener("click", onTabClick);
        tabsWrap.appendChild(btn);
      });
    }

    function renderModeButtons() {
      if (isZhenciType()) {
        styleBtn.textContent = "纹样";
        patternBtn.textContent = "颜色";
        patternBtn.classList.remove("pattern-tab-hidden");
        patternBtn.disabled = false;
        styleBtn.classList.toggle("active", state.zhenciMode === "pattern");
        patternBtn.classList.toggle("active", state.zhenciMode === "color");
        return;
      }
      styleBtn.textContent = "样式";
      patternBtn.textContent = "纹样";
      const isBody = state.currentTab === "body";
      /* 灯帽 / 灯托 / 灯垂：隐藏纹样按钮，保留样式 */
      patternBtn.classList.toggle("pattern-tab-hidden", !isBody);
      patternBtn.disabled = !isBody || !isBodyStyle2();
      if (!isBody && state.bodyMode === "pattern") state.bodyMode = "style";
      if (isBody && !isBodyStyle2() && state.bodyMode === "pattern") {
        state.bodyMode = "style";
        state.bodyDisplayMode = "style";
      }
      if (!isBodyStyle2() && state.bodyDisplayMode === "pattern") state.bodyDisplayMode = "style";
      styleBtn.classList.toggle("active", state.bodyMode === "style");
      patternBtn.classList.toggle("active", state.bodyMode === "pattern");
    }

    function renderOptions() {
      const meta = getOptionMeta();
      const slotCount = state.currentTab === "chui"
        ? OPTION_SLOT_COUNT_CHUI
        : (isZhenciType() ? 4 : (state.currentTab === "body" && state.bodyMode === "pattern" ? meta.count : OPTION_SLOT_COUNT_DEFAULT));
      let activeIndex = meta.active;
      if (isZhenciType()) {
        if (state.zhenciMode === "pattern" && !state.shownParts.zhenciPattern) activeIndex = null;
        if (state.zhenciMode === "color" && !state.shownParts.zhenciColor) activeIndex = null;
      } else {
        if (state.currentTab === "cap" && !state.shownParts.cap) activeIndex = null;
        if (state.currentTab === "base" && !state.shownParts.base) activeIndex = null;
        if (state.currentTab === "chui" && !state.shownParts.chui) activeIndex = null;
        if (state.currentTab === "body" && !state.shownParts.body) activeIndex = null;
      }
      optionsGrid.classList.toggle("grid-2x3", state.currentTab === "chui");
      optionsGrid.innerHTML = "";
      for (let i = 1; i <= slotCount; i += 1) {
        const node = document.createElement("div");
        if (i > meta.count) {
          node.className = "option placeholder";
          optionsGrid.appendChild(node);
          continue;
        }
        const labelText = meta.optionLabels && meta.optionLabels[i - 1] ? meta.optionLabels[i - 1] : `${meta.title}${i}`;
        const showOptionText = false;
        let optCls = "option" + (activeIndex === i ? " active" : "") + (meta.disabled ? " disabled" : "");
        if (getTypeDir() === "zhizha" && state.currentTab === "cap") {
          optCls += " thumb-90";
        }
        if (state.currentTab === "base") {
          optCls += (i === 3 ? " thumb-80" : " thumb-90");
        }
        if (state.currentTab === "body" && state.bodyMode === "style" && i === 1) {
          optCls += " thumb-70";
        }
        if (state.currentTab === "body" && state.bodyMode === "style" && i === 2) {
          optCls += " thumb-90";
        }
        if (state.currentTab === "body" && state.bodyMode === "style" && i === 4) {
          optCls += " thumb-90";
        }
        if (showOptionText) optCls += " pattern-option";
        node.className = optCls;
        node.dataset.index = String(i);
        node.innerHTML = showOptionText
          ? `<img src="images/${getTypeDir()}/${meta.prefix}${i}.png" alt="${labelText}"><span>${labelText}</span>`
          : `<img src="images/${getTypeDir()}/${meta.prefix}${i}.png" alt="${labelText}">`;
        if (!meta.disabled) node.addEventListener("click", onOptionClick);
        optionsGrid.appendChild(node);
      }
    }

    function renderUI() {
      renderTabs();
      renderModeButtons();
      renderOptions();
    }

    function loadImage(src) {
      if (imageCache.has(src)) return Promise.resolve(imageCache.get(src));
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          imageCache.set(src, img);
          resolve(img);
        };
        img.onerror = () => reject(new Error("图片加载失败: " + src));
        img.src = src;
      });
    }

    function clearLamp() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      ctx.clearRect(0, 0, w, h);
    }

    function triggerLampEnterGlow() {
      if (getTypeDir() !== "kezhi_liaosi") return;
      if (!canvas) return;
      canvas.classList.remove("lamp-enter-glow");
      void canvas.offsetWidth;
      canvas.classList.add("lamp-enter-glow");
      if (lampFxTimer) clearTimeout(lampFxTimer);
      lampFxTimer = window.setTimeout(() => {
        canvas.classList.remove("lamp-enter-glow");
      }, 1220);
    }

    function getBodyPieceSrc() {
      const s = state.selected;
      if (state.bodyDisplayMode === "pattern" && isBodyStyle2()) return `images/${getTypeDir()}/body_pattern_img_${s.bodyPattern}.png`;
      return `images/${getTypeDir()}/body_style_img_${s.bodyStyle}.png`;
    }

    /** 按画布尺寸等比缩放，paddingRatio 为相对画布宽高的留白比例（如 0.97 表示最多占 97%） */
    function computeDrawSize(img, cw, ch, paddingRatio) {
      const pad = paddingRatio == null ? 0.97 : paddingRatio;
      const aw = Math.max(1, cw * pad);
      const ah = Math.max(1, ch * pad);
      const s = Math.min(aw / img.width, ah / img.height);
      const targetW = Math.max(1, Math.round(img.width * s));
      const targetH = Math.max(1, Math.round(img.height * s));
      return { targetW, targetH };
    }

    function lampDrawXY(w, h, targetW, targetH) {
      const shiftUp = Math.round(h * LAMP_DRAW_SHIFT_UP_RATIO);
      return {
        drawX: Math.round((w - targetW) / 2),
        drawY: Math.round((h - targetH) / 2) - shiftUp,
      };
    }

    function drawComboPreviewImage(img) {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      ctx.clearRect(0, 0, w, h);
      const { targetW, targetH } = computeDrawSize(img, w, h, COMBO_PREVIEW_FIT);
      /* 预览 combo 图：严格居中，与卡片底色参考线一致（不用编辑页的 lampDrawXY 上移） */
      const drawX = Math.round((w - targetW) / 2);
      const drawY = Math.round((h - targetH) / 2);
      ctx.drawImage(img, drawX, drawY, targetW, targetH);
      triggerLampEnterGlow();
    }

    async function drawLamp() {
      if (state.previewMode) {
        const src = getComboImageSrc();
        try {
          const img = await loadImage(src);
          drawComboPreviewImage(img);
        } catch {
          window.alert("该组合暂未开放");
          state.previewMode = false;
          makerPage.classList.remove("preview-mode");
          if (flipCard) flipCard.classList.remove("flip-on-enter");
          showHome();
        }
        return;
      }

      if (isZhenciType()) {
        const src = !state.zhenciDisplayMode
          ? `images/${getTypeDir()}/bg.png`
          : `images/${getTypeDir()}/${state.zhenciDisplayMode}_${state.zhenciDisplayMode === "pattern" ? state.selected.zhenciPattern : state.selected.zhenciColor}.png`;
        try {
          const img = await loadImage(src);
          const w = canvas.clientWidth;
          const h = canvas.clientHeight;
          ctx.clearRect(0, 0, w, h);
          const { targetW, targetH } = computeDrawSize(img, w, h, 0.97);
          const drawX = Math.round((w - targetW) / 2);
          const drawY = Math.round((h - targetH) / 2);
          ctx.drawImage(img, drawX, drawY, targetW, targetH);
          triggerLampEnterGlow();
        } catch (err) {
          console.error(err);
        }
        return;
      }

      const hasAnyPart = state.shownParts.cap || state.shownParts.body || state.shownParts.base || state.shownParts.chui;
      if (!hasAnyPart) return clearLamp();

      const pieces = [];
      if (state.shownParts.base) pieces.push(`images/${getTypeDir()}/base_img_${state.selected.base}.png`);
      if (state.shownParts.body) pieces.push(getBodyPieceSrc());
      if (state.shownParts.cap) pieces.push(`images/${getTypeDir()}/cap_img_${state.selected.cap}.png`);
      if (state.shownParts.chui) pieces.push(`images/${getTypeDir()}/chui_img_${state.selected.chui}.png`);

      try {
        const images = await Promise.all(pieces.map((src) => loadImage(src)));
        const w = canvas.clientWidth;
        const h = canvas.clientHeight;
        ctx.clearRect(0, 0, w, h);
        images.forEach((img) => {
          const { targetW, targetH } = computeDrawSize(img, w, h, 0.97);
          const { drawX, drawY } = lampDrawXY(w, h, targetW, targetH);
          ctx.drawImage(img, drawX, drawY, targetW, targetH);
        });
        triggerLampEnterGlow();
      } catch (err) {
        console.error(err);
      }
    }

    function onTabClick(e) {
      state.currentTab = e.currentTarget.dataset.key;
      state.bodyMode = "style";
      renderUI();
      drawLamp();
    }

    function onModeClick(e) {
      const mode = e.currentTarget.dataset.mode;
      if (isZhenciType()) {
        state.zhenciMode = mode === "style" ? "pattern" : "color";
        renderUI();
        drawLamp();
        return;
      }
      if (mode === "pattern" && (state.currentTab !== "body" || !isBodyStyle2())) return;
      state.bodyMode = mode;
      renderUI();
      drawLamp();
    }

    function applyOptionSelection(index) {
      if (isZhenciType()) {
        if (state.zhenciMode === "pattern") {
          state.selected.zhenciPattern = index;
          state.shownParts.zhenciPattern = true;
          state.zhenciDisplayMode = "pattern";
        } else {
          state.selected.zhenciColor = index;
          state.shownParts.zhenciColor = true;
          state.zhenciDisplayMode = "color";
        }
        return;
      }
      if (state.currentTab === "cap") {
        state.selected.cap = index;
        state.shownParts.cap = true;
      } else if (state.currentTab === "base") {
        state.selected.base = index;
        state.shownParts.base = true;
      } else if (state.currentTab === "chui") {
        state.selected.chui = index;
        // 灯垂 6：无灯垂，展示区不绘制灯垂图层
        state.shownParts.chui = index !== 6;
      } else if (state.currentTab === "body") {
        if (state.bodyMode === "style") {
          state.selected.bodyStyle = index;
          state.bodyDisplayMode = "style";
          state.shownParts.body = true;
        } else {
          if (!isBodyStyle2()) return;
          state.selected.bodyPattern = index;
          state.bodyDisplayMode = "pattern";
          state.shownParts.body = true;
        }
      }
    }

    function onOptionClick(e) {
      const index = Number(e.currentTarget.dataset.index);
      applyOptionSelection(index);
      renderUI();
      drawLamp();
    }

    function shiftCurrentOption(delta) {
      if (state.previewMode) return;
      const meta = getOptionMeta();
      if (meta.disabled || !meta.count || !meta.active) return;
      const next = ((meta.active - 1 + delta + meta.count) % meta.count) + 1;
      applyOptionSelection(next);
      renderUI();
      drawLamp();
    }

    function showMakerForType(typeKey) {
      currentLampType = typeKey;
      state = makerStates[typeKey] || createDefaultState();
      makerStates[typeKey] = state;
      if (comboBackImg) comboBackImg.src = "images/combo_back.png";
      homePage.classList.add("hidden");
      typePage.classList.add("hidden");
      makerPage.classList.remove("hidden");
      setCanvasSize();
      makerPage.classList.toggle("preview-mode", state.previewMode);
      if (!state.previewMode && flipCard) flipCard.classList.remove("flip-on-enter");
      renderUI();
      drawLamp();
    }

    function showTypeSelect() {
      state.previewMode = false;
      makerPage.classList.remove("preview-mode");
      if (flipCard) flipCard.classList.remove("flip-on-enter");
      makerPage.classList.add("hidden");
      homePage.classList.add("hidden");
      typePage.classList.remove("hidden");
    }

    function showHome() {
      state.previewMode = false;
      makerPage.classList.remove("preview-mode");
      if (flipCard) flipCard.classList.remove("flip-on-enter");
      makerPage.classList.add("hidden");
      typePage.classList.add("hidden");
      homePage.classList.remove("hidden");
    }

    function restartFlipPreviewIntro() {
      if (!flipCard) return;
      flipCard.classList.remove("flip-on-enter");
      void flipCard.offsetWidth;
      flipCard.classList.add("flip-on-enter");
    }

    function replayPreviewAnimation() {
      if (!state.previewMode) return;
      restartFlipPreviewIntro();
    }

    async function enterPreviewMode() {
      const hasAnyPart = isZhenciType()
        ? (state.shownParts.zhenciPattern || state.shownParts.zhenciColor)
        : (state.shownParts.cap || state.shownParts.body || state.shownParts.base || state.shownParts.chui);
      if (!hasAnyPart) {
        window.alert("请先搭配您的花灯");
        return;
      }
      const src = getComboImageSrc();
      let img;
      try {
        img = await loadImage(src);
      } catch {
        window.alert("该组合暂未开放");
        showTypeSelect();
        return;
      }
      state.previewMode = true;
      makerPage.classList.add("preview-mode");
      requestAnimationFrame(() => {
        setCanvasSize();
        drawComboPreviewImage(img);
        restartFlipPreviewIntro();
      });
    }

    function exitPreviewMode() {
      state.previewMode = false;
      makerPage.classList.remove("preview-mode");
      if (flipCard) flipCard.classList.remove("flip-on-enter");
      requestAnimationFrame(() => {
        setCanvasSize();
        drawLamp();
      });
    }

    function togglePreviewMode() {
      if (state.previewMode) exitPreviewMode();
      else enterPreviewMode();
    }

    function onBackClick() {
      if (state.previewMode) return showHome();
      showTypeSelect();
    }

    startBtn.addEventListener("click", () => {
      homePage.classList.add("hidden");
      typePage.classList.remove("hidden");
    });
    typeButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        showMakerForType(btn.dataset.type);
      });
    });
    typeBackBtn.addEventListener("click", showHome);
    backBtn.addEventListener("click", onBackClick);
    confirmBtn.addEventListener("click", togglePreviewMode);
    previewReplayBtn.addEventListener("click", replayPreviewAnimation);
    styleBtn.addEventListener("click", onModeClick);
    patternBtn.addEventListener("click", onModeClick);
    makerNavLeft.addEventListener("click", () => shiftCurrentOption(-1));
    makerNavRight.addEventListener("click", () => shiftCurrentOption(1));

    window.addEventListener("resize", () => {
      if (!makerPage.classList.contains("hidden")) {
        setCanvasSize();
        drawLamp();
      }
    });
  </script>
</body>
</html>
